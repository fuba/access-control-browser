# Example policy file. Copy to ./config.yaml and edit.
# See docs/config-schema.md for the full schema.

# Monotonic counter, only enforced for signed policies (daemon started with
# --verify-key): a reload with a lower revision is refused, so an older
# signed file cannot be replayed. `acb-cli edit-config --signing-key` bumps it.
revision: 1

server:
  bind: "127.0.0.1"
  port: 39100
  log_file: "./logs/access-control-browser.log"
  log_rotation: "daily"
  config_poll_ms: 0

chromium:
  binary: null
  user_data_dir: "./var/profile"
  viewport: { width: 1280, height: 800 }
  # format: webp (recommended) | jpeg | png. webp is ~25-35% smaller than
  # jpeg at the same quality, so fewer bytes per frame over the WebSocket.
  # max_fps is the cadence while the page is changing; a static page is
  # detected by frame dedupe and automatically drops to a 2fps idle tick.
  screencast: { format: "webp", quality: 70, max_fps: 12 }
  extra_args:
    - "--disable-features=WebRTC,WebTransport,SharedArrayBuffer"
    - "--disable-background-networking"

resource_policy:
  subresources_inherit_page: true
  always_block_schemes: ["javascript", "data", "file", "chrome", "about", "blob", "ws", "wss"]
  bypass_service_worker: true

rules:
  - name: "github"
    match: { kind: "fqdn", host: "github.com", subdomains: false }
    allowed_classes: ["js-issue-row", "Box-row"]

  - name: "wikipedia-any-lang"
    match: { kind: "fqdn", host: "wikipedia.org", subdomains: true }
    allowed_classes: ["mw-parser-output", "vector-menu-content"]

  - name: "internal-docs"
    match:
      kind: "regex"
      pattern: "^https://docs\\.internal\\.example\\.com/(api|guide)(/.*)?$"
    allowed_classes: ["doc-content"]

  - name: "lan-grafana"
    match:
      kind: "ip_cidr"
      cidr: "10.0.0.0/8"
      ports: [3000]
      schemes: ["http", "https"]
    allowed_classes: ["dashboard-panel"]
