[package]
name = "acb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Access-controlled browser CLI"

[lib]
name = "acb_cli"
path = "src/lib.rs"

[[bin]]
name = "acb-cli"
path = "src/main.rs"

[dependencies]
acb-policy = { path = "../policy" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Staging files for `edit-config` / signing; also used by the tests.
tempfile = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# For the session-sharing integration test: spawn a real daemon in-process
# and drive the acb-cli binary against it.
acb-daemon = { path = "../daemon" }
