[workspace]
resolver = "2"
members = [
    "crates/policy",
    "crates/cli",
    "crates/daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["fuba <ecceecce@gmail.com>"]
repository = "https://github.com/fuba/access-control-browser"
rust-version = "1.75"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
thiserror = "1"
anyhow = "1"

# URL / network
url = "2.5"
regex = "1.10"
ipnet = "2.9"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async / HTTP / WS / SSE
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["set-header"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CDP — kept on the newest crates.io release because Chromium's CDP
# schema changes between major Chromium versions; older chromiumoxide
# crates fail to deserialize WS responses ("did not match any variant
# of untagged enum Message") against Chrome 147.
chromiumoxide = "0.9"

# Misc daemon utilities
arc-swap = "1.7"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
notify = "6.1"
notify-debouncer-full = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
