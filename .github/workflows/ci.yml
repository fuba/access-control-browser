name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        run: ./scripts/build-ui.sh

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
        env:
          CHROME: /usr/bin/chromium

      - name: Injection grep gate
        # The agent must never reach Runtime.evaluate(expression) with
        # operator-supplied content. The helper bootstrap is the only
        # allowlisted callsite.
        run: |
          set -e
          out=$(grep -RE "Runtime\.evaluate|expression\s*:" crates/daemon/src || true)
          violations=$(printf "%s\n" "$out" | grep -v 'crates/daemon/src/browser/injected.rs' || true)
          if [ -n "$violations" ]; then
            echo "Forbidden Runtime.evaluate usage outside helper bootstrap:"
            echo "$violations"
            exit 1
          fi

  docker-build:
    # On main / PR: build amd64+arm64 to verify the Dockerfile.
    # On a v* tag push: also push to ghcr.io with semver-derived tags.
    name: Docker buildx (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (and push on v* tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache. mode=max stores layers
          # for every stage (ui-build, rust-build, runtime) so subsequent
          # runs only redo what actually changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # Cut a GitHub Release the moment a v* tag's pipeline goes green.
    # Gated on test + docker-build so a release only exists when the
    # multi-arch image is actually published to ghcr.io.
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          # The annotated tag message is our human-written changelog line.
          TAG_BODY="$(git for-each-ref "refs/tags/${TAG}" --format='%(contents)')"

          NOTES="$(cat <<EOF
          ${TAG_BODY}

          ## Docker image

          Multi-arch (\`linux/amd64\`, \`linux/arm64\`):

          \`\`\`
          docker pull ghcr.io/${REPO}:${VERSION}
          \`\`\`

          Also tagged \`:${VERSION%%.*}\`, \`:${VERSION%.*}\`, and \`:latest\`.

          ---
          _Auto-generated by CI on tag push._
          EOF
          )"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes."
            gh release edit "$TAG" --repo "$REPO" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "$NOTES"
          fi
